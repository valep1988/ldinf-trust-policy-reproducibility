name: Reproduce finite benchmarks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check finite model and abstraction
        run: |
          python scripts/joint_policy_example.py
          python scripts/JLC_nonidentity_abstraction_check.py
      - name: Generate synthetic benchmarks
        run: python scripts/JLC_benchmark_extended.py --output regenerated_benchmark.csv
      - name: Compare stable data columns
        run: |
          python - <<'END_PYTHON'
          import csv
          cols=('family','n','method','graph_builds','feasible_representatives','states_constructed','edges_constructed')
          with open('data/JLC_benchmark_extended.csv',newline='') as f: ref=list(csv.DictReader(f))
          with open('regenerated_benchmark.csv',newline='') as f: got=list(csv.DictReader(f))
          assert len(ref)==len(got)==27
          assert [[r[c] for c in cols] for r in ref]==[[r[c] for c in cols] for r in got]
          print('PASS: 27 stable benchmark rows')
          END_PYTHON
